<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime Chat V1</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; height: 100vh; display: flex; justify-content: center; align-items: center; }
  .app { width: 100%; max-width: 760px; height: 92vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); display: flex; flex-direction: column; overflow: hidden; }
  header { background: #1e293b; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header small { color: #94a3b8; display: block; font-size: 12px; }
  .main { flex: 1; display: flex; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  aside { width: 160px; border-left: 1px solid #e2e8f0; padding: 12px; font-size: 14px; overflow-y: auto; }
  aside h4 { margin: 0 0 8px; color: #64748b; font-size: 12px; text-transform: uppercase; }
  aside li { list-style: none; padding: 3px 0; }
  aside ul { margin: 0; padding: 0; }
  aside li::before { content: "● "; color: #22c55e; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; background: #e2e8f0; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg b { font-size: 12px; display: block; opacity: .75; }
  .msg time { font-size: 10px; opacity: .6; }
  .sys { align-self: center; color: #94a3b8; font-size: 12px; }
  #typing { height: 20px; padding: 0 16px; color: #64748b; font-size: 12px; font-style: italic; }
  .bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; font-size: 15px; }
  #login { position: fixed; inset: 0; background: rgba(15,23,42,.85); display: flex; justify-content: center; align-items: center; }
  #login div { background: #fff; padding: 24px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; width: 300px; }
  @media (max-width: 560px) { aside { display: none; } }
</style>
</head>
<body>
<div id="login"><div>
  <h3 style="margin:0">Join the chat</h3>
  <input id="nameInput" placeholder="Your name" maxlength="20" autofocus>
  <button id="joinBtn">Join</button>
</div></div>

<div class="app">
  <header>
    <div>Realtime Chat<small id="info">connecting...</small></div>
    <div id="count">0 online</div>
  </header>
  <div class="main">
    <div id="messages"></div>
    <aside><h4>Online</h4><ul id="users"></ul></aside>
  </div>
  <div id="typing"></div>
  <div class="bar">
    <input id="msgInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myName = '';
  const $ = (id) => document.getElementById(id);
  const box = $('messages');

  function add(el) {
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }
  function addMessage(m) {
    const d = document.createElement('div');
    d.className = 'msg' + (m.name === myName ? ' me' : '');
    const n = document.createElement('b'); n.textContent = m.name;
    const t = document.createElement('div'); t.textContent = m.text;
    const tm = document.createElement('time');
    tm.textContent = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    d.append(n, t, tm);
    add(d);
  }
  function addSystem(text) {
    const d = document.createElement('div');
    d.className = 'sys'; d.textContent = text;
    add(d);
  }

  function join() {
    myName = $('nameInput').value.trim() || 'Guest';
    socket.emit('join', myName);
    $('login').style.display = 'none';
    $('msgInput').focus();
  }
  $('joinBtn').onclick = join;
  $('nameInput').onkeydown = (e) => { if (e.key === 'Enter') join(); };

  function send() {
    const v = $('msgInput').value.trim();
    if (!v) return;
    socket.emit('message', v);
    socket.emit('typing', false);
    $('msgInput').value = '';
  }
  $('sendBtn').onclick = send;
  let typingTimer;
  $('msgInput').oninput = () => {
    socket.emit('typing', true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit('typing', false), 1500);
  };
  $('msgInput').onkeydown = (e) => { if (e.key === 'Enter') send(); };

  socket.on('info', (i) => { $('info').textContent = `app ${i.version} · served by container ${i.host}`; });
  socket.on('history', (list) => list.forEach(addMessage));
  socket.on('message', addMessage);
  socket.on('system', addSystem);
  socket.on('users', (list) => {
    $('count').textContent = list.length + ' online';
    $('users').innerHTML = '';
    list.forEach((u) => { const li = document.createElement('li'); li.textContent = u; $('users').appendChild(li); });
  });
  socket.on('typing', ({ name, isTyping }) => {
    $('typing').textContent = isTyping ? name + ' is typing...' : '';
  });
</script>
</body>
</html>
